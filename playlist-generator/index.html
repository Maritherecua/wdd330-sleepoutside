<!-- Playlist Generator HTML This app allows users to generate playlists based on their mood and preferences. Uses
 mood-selection buttons and a dropdown menu, then combines iTunes Search API results with TheAudioDB metadata
 to enrich playlist tracks with album and genre information. -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist Generator</title>
  <meta name="author" content="Maria Arroyo" />
  <meta name="description" content="Generate playlists based on your mood and preferences." />
  <link rel="icon" type="image/webp" href="images/logo.webp" />
  <link rel="stylesheet" href="styles/playlislarger.css" />
</head>

<body>
  <main>
    <section id="mood-selection">
      <header>
        <div class="header-top">
          <img class="site-logo" src="images/logo.webp" alt="Mood Tunes logo" width="80" height="80" />
          <h1>Mood Tunes</h1>
          <a href="profile.html" class="profile-btn" aria-label="Profile and History">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
              <path d="M16 11l1.5 4.5M16 11l3-1" />
            </svg>
            <span>History</span>
          </a>
        </div>
        <nav aria-label="Main navigation">
          <ul class="main-nav">
            <li><a href="#mood-selection">Home</a></li>
            <li><a href="#playlist">Playlist</a></li>
            <li><a href="profile.html">Profile/Favorites</a></li>
          </ul>
        </nav>
      </header>
      <div class="hero">
        <h2>How are you feeling today?</h2>
        <div class="mood-grid">
          <div class="mood-card energetic" data-mood="energetic">Energetic</div>
          <div class="mood-card melancholy" data-mood="melancholy">Melancholy</div>
          <div class="mood-card chill" data-mood="chill">Chill</div>
          <div class="mood-card productive" data-mood="productive">Productive</div>
        </div>
      </div>
      <div class="mood-controls">
        <h2>Select Your Mood</h2>
        <div class="mood-button-group">
          <button class="mood-btn" data-mood="happy">😊 Happy</button>
          <button class="mood-btn" data-mood="sad">😢 Sad</button>
          <button class="mood-btn" data-mood="energetic">⚡ Energetic</button>
          <button class="mood-btn" data-mood="relaxed">😌 Relaxed</button>
          <button class="mood-btn" data-mood="productive">💼 Productive</button>
          <button class="mood-btn" data-mood="custom">🎵 Custom</button>
        </div>
        <!--user input for custom mood-->
        <input type="text" id="custom-mood" placeholder="Enter your mood" />
        <p>Or select your mood from the dropdown:</p>
        <label for="mood-dropdown">Mood</label>
        <select id="mood-dropdown">
          <option value="happy">😊 Happy</option>
          <option value="sad">😢 Sad</option>
          <option value="energetic">⚡ Energetic</option>
          <option value="relaxed">😌 Relaxed</option>
          <option value="productive">💼 Productive</option>
          <option value="custom">🎵 Custom</option>
        </select>
        <button id="generate-playlist">Generate Playlist</button>
      </div>
    </section>
    <section id="playlist">
      <h2 id="playlist-heading">Your Playlist</h2>
      <div class="action-bar">
        <button id="save-favorites-btn" class="action-btn" aria-label="Save to Favorites">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" />
          </svg>
          Save to Favorites
        </button>
        <a id="spotify-btn" class="action-btn action-btn--spotify" href="https://open.spotify.com" target="_blank"
          rel="noopener noreferrer" aria-label="Open Spotify">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
            aria-hidden="true">
            <path
              d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.623.623 0 0 1-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.623.623 0 1 1-.277-1.215c3.809-.87 7.077-.496 9.712 1.115a.623.623 0 0 1 .207.857zm1.223-2.722a.78.78 0 0 1-1.072.257C14.1 12.226 10.818 11.8 7.8 12.7a.78.78 0 0 1-.964-.52.782.782 0 0 1 .52-.965c3.453-.99 7.146-.51 9.897 1.215a.78.78 0 0 1 .256 1.072zm.105-2.835C15.12 9.007 11.1 8.872 8.167 9.741a.937.937 0 1 1-.543-1.793c3.372-.982 8.054-.838 11.232 1.218a.937.937 0 0 1-.942 1.621z" />
          </svg>
          Save to Spotify
        </a>
        <button id="share-btn" class="action-btn" aria-label="Share Playlist">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3" />
            <circle cx="6" cy="12" r="3" />
            <circle cx="18" cy="19" r="3" />
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" />
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" />
          </svg>
          Share
        </button>
      </div>
      <p id="action-feedback" class="action-feedback" aria-live="polite"></p>
      <ul id="playlist-songs">
        <!-- Songs will be dynamically added here -->
      </ul>
    </section>
  </main>

  <!-- Template for a single tracklist card -->
  <template id="tracklist-card-template">
    <li class="track-card">
      <img class="track-thumbnail" src="" alt="" />
      <div class="track-info">
        <span class="track-title"></span>
        <span class="track-artist"></span>
        <span class="track-meta"></span>
      </div>
      <button class="track-save-btn" type="button" aria-label="Add track to favorites">Add to Favorites</button>
    </li>
  </template>
  <script type="module" src="scripts/generator.js"></script>
</body>
<footer>
  <p class="footer-text">© 2026 Mood Tunes. All rights reserved. Maria Arroyo.</p>
</footer>
</html>
